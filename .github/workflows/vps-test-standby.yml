name: OWN VPS - 15M TEST B STANDBY

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: A runner run ID
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  standby:
    name: VPS Test Worker B
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      VPS_ROOT: /opt/vps-data
      SUPERDMZ_HOST: sareeffucker.dmzgate.com
      SUPERDMZ_PORT: 16740
      SYNC_INTERVAL: 15
      MONGO_DB: own_vps
      SOURCE_RUN: ${{ inputs.source_run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare system
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server curl jq rsync ca-certificates python3-venv
          sudo mkdir -p "$VPS_ROOT"
          sudo systemctl enable --now ssh

      - name: Check secrets
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
          SSH_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          test -n "$SUPERDMZ_TOKEN"
          test -n "$SSH_KEYS"
          test -n "$MONGO_URI"

      - name: Install Mongo runtime
        run: |
          set -euo pipefail
          python3 -m venv /opt/vps-sync-venv
          /opt/vps-sync-venv/bin/pip install --disable-pip-version-check --quiet "pymongo>=4.13,<5"

      - name: Connect SuperDMZ
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://superdmz.com/download/LinuxInstaller.sh | sudo sh
          sudo superdmz -add-token="$SUPERDMZ_TOKEN"
          for i in $(seq 1 45); do
            if sudo superdmz -status 2>&1 | grep -qiE 'online|connected|active'; then break; fi
            sleep 2
          done
          sudo superdmz -status
          sudo superdmz -list

      - name: Restore latest Mongo state
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          sudo /opt/vps-sync-venv/bin/python vps/mongo_sync.py restore --uri "$MONGO_URI" --db "$MONGO_DB" --runner-id "$GITHUB_RUN_ID" --generation "$GITHUB_RUN_NUMBER"

      - name: Configure SSH
        env:
          SSH_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
        run: |
          set -euo pipefail
          sudo install -d -m 700 /root/.ssh
          printf '%s\n' "$SSH_KEYS" | sudo tee /root/.ssh/authorized_keys >/dev/null
          sudo chmod 600 /root/.ssh/authorized_keys
          sudo install -d -m 755 /etc/ssh/sshd_config.d
          sudo tee /etc/ssh/sshd_config.d/99-own-vps.conf >/dev/null <<'EOF'
          PermitRootLogin prohibit-password
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          ChallengeResponseAuthentication no
          X11Forwarding no
          AllowTcpForwarding yes
          ClientAliveInterval 60
          ClientAliveCountMax 3
          EOF
          sudo sshd -t
          sudo systemctl restart ssh

      - name: Start B live standby mirror
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          nohup sudo /opt/vps-sync-venv/bin/python vps/mongo_sync.py mirror --uri "$MONGO_URI" --db "$MONGO_DB" --runner-id "$GITHUB_RUN_ID" --generation "$GITHUB_RUN_NUMBER" --interval "$SYNC_INTERVAL" >/tmp/mongo-mirror.log 2>&1 &
          echo $! >/tmp/mongo-mirror.pid
          sleep 3
          cat /tmp/mongo-mirror.log || true

      - name: B readiness verification
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          sudo systemctl is-active --quiet ssh
          test -d "$VPS_ROOT"
          sudo ss -lntp | grep ':22 '

          status_output="$(sudo superdmz -status 2>&1 || true)"
          printf '%s\\n' "$status_output"
          if printf '%s\\n' "$status_output" | grep -qi 'ONLINE'; then
            echo "B_PUBLIC_TUNNEL=ONLINE"
          else
            echo "B_PUBLIC_TUNNEL=NOT_ONLINE"
            exit 1
          fi

          test -s /tmp/mongo-mirror.pid
          mirror_pid="$(cat /tmp/mongo-mirror.pid)"
          sudo kill -0 "$mirror_pid"
          echo "B_MONGO_MIRROR=ALIVE"

          export MONGO_URI
          python3 - <<'PY'
          import os,time,hashlib
          from pymongo import MongoClient
          db=MongoClient(os.environ["MONGO_URI"])["own_vps"]

          live=db.vps_meta.find_one({"_id":"live"}) or {}
          files=list(db.vps_files.find({"deleted":False},{"sha256":1,"path":1}))
          bad=[]

          for f in files:
              p=f["path"]
              try:
                  h=hashlib.sha256()
                  with open(p,"rb") as x:
                      for b in iter(lambda:x.read(1024*1024),b""):
                          h.update(b)
                  if h.hexdigest()!=f["sha256"]:
                      bad.append(p)
              except Exception:
                  bad.append(p)

          if bad:
              db.vps_runners.update_one({"_id":os.environ["GITHUB_RUN_ID"]},{"$set":{
                "status":"verification_failed",
                "verification_errors":bad[:20],
                "verified_at":time.time()
              }},upsert=True)
              raise SystemExit("B verification failed")

          db.vps_runners.update_one({"_id":os.environ["GITHUB_RUN_ID"]},{"$set":{
            "runner_id":os.environ["GITHUB_RUN_ID"],
            "generation":os.environ["GITHUB_RUN_NUMBER"],
            "source_run":os.environ["SOURCE_RUN"],
            "status":"verified",
            "verified_at":time.time(),
            "verified_file_count":len(files)
          }},upsert=True)

          db.vps_events.insert_one({
            "event":"test_b_verified",
            "runner_id":os.environ["GITHUB_RUN_ID"],
            "source_run":os.environ["SOURCE_RUN"],
            "generation":os.environ["GITHUB_RUN_NUMBER"],
            "created_at":time.time(),
            "file_count":len(files)
          })

          print("B_SELF_VERIFICATION=PASS")
          print("B_FILES_VERIFIED=",len(files))
          PY

      - name: B final active declaration
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          export MONGO_URI
          python3 - <<'PY'
          import os,time,sys
          from pymongo import MongoClient
          db=MongoClient(os.environ["MONGO_URI"])["own_vps"]
          rid=os.environ["GITHUB_RUN_ID"]
          r=db.vps_runners.find_one({"_id":rid}) or {}

          if r.get("status")!="verified":
              sys.exit("B cannot become ACTIVE: self-verification did not pass")

          db.vps_meta.update_one({"_id":"live"},{"$set":{
            "active_runner":rid,
            "generation":os.environ["GITHUB_RUN_NUMBER"],
            "status":"active",
            "activated_at":time.time(),
            "test_source_run":os.environ["SOURCE_RUN"]
          }},upsert=True)

          db.vps_runners.update_one({"_id":rid},{"$set":{
            "status":"active",
            "activated_at":time.time()
          }},upsert=True)

          db.vps_events.insert_one({
            "event":"test_b_activated",
            "runner_id":rid,
            "source_run":os.environ["SOURCE_RUN"],
            "generation":os.environ["GITHUB_RUN_NUMBER"],
            "created_at":time.time()
          })

          print("B_STATUS=ACTIVE")
          print("B_IS_NOW_ALLOWED_TO_TAKEOVER=A")
          PY

      - name: Cancel A after B takeover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "B is ACTIVE. Requesting cancellation of A run ${SOURCE_RUN}."
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/actions/runs/${SOURCE_RUN}/cancel"
          echo "A_CANCEL_REQUESTED=${SOURCE_RUN}"

      - name: Keep B alive
        run: |
          set -euo pipefail
          while true; do
            echo "B ACTIVE - A cancellation requested"
            sleep 60
          done
