name: OWN VPS - Controller

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: own-vps-controller
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPO: ${{ github.repository }}
      MONGO_DB: own_vps
    steps:
      - uses: actions/checkout@v6

      - name: Prepare controller runtime
        run: |
          set -euo pipefail
          python3 -m venv /opt/controller-venv
          /opt/controller-venv/bin/pip install --disable-pip-version-check --quiet "pymongo>=4.13,<5"

      - name: Reconcile control plane
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          status="$(/opt/controller-venv/bin/python controller/state.py status             --uri "$MONGO_URI" --db "$MONGO_DB" || true)"
          echo "CONTROL_PLANE=$status"

          active_runs="$(gh run list --workflow worker.yml --repo "$REPO" --status in_progress --limit 20 --json databaseId --jq 'length')"
          standby_runs="$(gh run list --workflow standby.yml --repo "$REPO" --status in_progress --limit 20 --json databaseId --jq 'length')"

          echo "active_workflow_runs=$active_runs standby_workflow_runs=$standby_runs"

          heartbeat_age="$(printf '%s' "$status" | jq -r '.heartbeat_age // 999999')"
          active_runner="$(printf '%s' "$status" | jq -r '.active_runner // empty')"

          if [ "$active_runs" -eq 0 ] && [ "$standby_runs" -eq 0 ]; then
            echo "NO_WORKER: starting recovery"
            gh workflow run worker.yml --repo "$REPO" --ref main
            exit 0
          fi

          if [ -n "$active_runner" ] && [ "$heartbeat_age" != "null" ]; then
            if awk "BEGIN {exit !($heartbeat_age > 150)}"; then
              echo "STALE_ACTIVE_HEARTBEAT: $heartbeat_age seconds"
              gh run list --workflow worker.yml --repo "$REPO" --status in_progress --limit 20 --json databaseId --jq '.[].databaseId' |
                xargs -r -n1 gh api -X POST "/repos/$REPO/actions/runs/{}/cancel" || true
              gh run list --workflow standby.yml --repo "$REPO" --status in_progress --limit 20 --json databaseId --jq '.[].databaseId' |
                xargs -r -n1 gh api -X POST "/repos/$REPO/actions/runs/{}/cancel" || true
              sleep 5
              gh workflow run worker.yml --repo "$REPO" --ref main
              exit 0
            fi
          fi

          echo "CONTROL_PLANE_HEALTHY"
