name: OWN VPS - Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Recover controller and worker if missing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          controllers="$(gh run list --workflow controller.yml --repo "$REPO" --status in_progress \
            --limit 50 --json databaseId --jq 'length')"

          workers="$(gh run list --workflow worker.yml --repo "$REPO" --status in_progress \
            --limit 50 --json databaseId --jq 'length')"

          standbys="$(gh run list --workflow standby.yml --repo "$REPO" --status in_progress \
            --limit 50 --json databaseId --jq 'length')"

          echo "controllers=$controllers workers=$workers standbys=$standbys"

          # Controller is the always-on control plane. If a controller is
          # missing, start one immediately. The controller itself performs
          # A->B-style self-handover before the GitHub runner limit.
          if [ "$controllers" -eq 0 ]; then
            echo "NO_CONTROLLER: starting controller"
            gh workflow run controller.yml --repo "$REPO" --ref main
            sleep 10
          fi

          # The controller owns worker recovery. Do not dispatch a worker
          # directly from the watchdog: GitHub run visibility can lag MongoDB's
          # leader lease during handover and create duplicate workers.
          if [ "$controllers" -gt 0 ]; then
            echo "CONTROLLER_PRESENT: worker recovery delegated to controller"
            exit 0
          fi

          # If there was no controller, we already started one above.
          # The new controller will inspect MongoDB before creating a worker.
          echo "CONTROLLER_RECOVERY_ONLY"
