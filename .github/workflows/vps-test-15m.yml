name: OWN VPS - 15M A to B Handover TEST

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  vps:
    name: VPS Test Worker A
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      REPO: ${{ github.repository }}
      VPS_ROOT: /opt/vps-data
      SUPERDMZ_HOST: sareeffucker.dmzgate.com
      SUPERDMZ_PORT: 16740
      SYNC_INTERVAL: 15
      B_START_AFTER: 900
      MONGO_DB: own_vps
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare system
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server curl jq git rsync ca-certificates netcat-openbsd python3-venv
          sudo mkdir -p "$VPS_ROOT"
          sudo systemctl enable --now ssh
      - name: Check secrets
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
          SSH_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          test -n "$SUPERDMZ_TOKEN"
          test -n "$SSH_KEYS"
          test -n "$MONGO_URI"
      - name: Install Mongo runtime
        run: |
          set -euo pipefail
          python3 -m venv /opt/vps-sync-venv
          /opt/vps-sync-venv/bin/pip install --disable-pip-version-check --quiet "pymongo>=4.13,<5"
      - name: Connect SuperDMZ
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://superdmz.com/download/LinuxInstaller.sh | sudo sh
          sudo superdmz -add-token="$SUPERDMZ_TOKEN"
          for i in $(seq 1 45); do
            if sudo superdmz -status 2>&1 | grep -qiE 'online|connected|active'; then break; fi
            sleep 2
          done
          sudo superdmz -status
          sudo superdmz -list
      - name: Restore Mongo durable state
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          sudo /opt/vps-sync-venv/bin/python vps/mongo_sync.py restore --uri "$MONGO_URI" --db "$MONGO_DB" --runner-id "$GITHUB_RUN_ID" --generation "$GITHUB_RUN_NUMBER"
      - name: Configure SSH
        env:
          SSH_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
        run: |
          set -euo pipefail
          sudo install -d -m 700 /root/.ssh
          printf '%s\n' "$SSH_KEYS" | sudo tee /root/.ssh/authorized_keys >/dev/null
          sudo chmod 600 /root/.ssh/authorized_keys
          sudo install -d -m 755 /etc/ssh/sshd_config.d
          sudo tee /etc/ssh/sshd_config.d/99-own-vps.conf >/dev/null <<'EOF'
          PermitRootLogin prohibit-password
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          ChallengeResponseAuthentication no
          X11Forwarding no
          AllowTcpForwarding yes
          ClientAliveInterval 60
          ClientAliveCountMax 3
          EOF
          sudo sshd -t
          sudo systemctl restart ssh
      - name: Start A Mongo live sync
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          nohup sudo /opt/vps-sync-venv/bin/python vps/mongo_sync.py sync --uri "$MONGO_URI" --db "$MONGO_DB" --runner-id "$GITHUB_RUN_ID" --generation "$GITHUB_RUN_NUMBER" --interval "$SYNC_INTERVAL" >/tmp/mongo-sync.log 2>&1 &
          echo $! >/tmp/mongo-sync.pid
      - name: A readiness gate
        run: |
          set -euo pipefail
          sudo systemctl is-active --quiet ssh
          test -d "$VPS_ROOT"
          sudo ss -lntp | grep ':22 '
          for i in $(seq 1 30); do
            if timeout 5 bash -c "cat </dev/null >/dev/tcp/$SUPERDMZ_HOST/$SUPERDMZ_PORT" 2>/dev/null; then
              echo "A_PUBLIC_TCP=READY"
              exit 0
            fi
            sleep 2
          done
          sudo superdmz -status || true
          exit 1
      - name: A baseline checkpoint
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          sudo /opt/vps-sync-venv/bin/python vps/mongo_sync.py once --uri "$MONGO_URI" --db "$MONGO_DB" --runner-id "$GITHUB_RUN_ID" --generation "$GITHUB_RUN_NUMBER"
          echo "A_READY run=$GITHUB_RUN_ID time=$(date -Is)"
      - name: Wait 15 minutes then start B
        run: |
          set -euo pipefail
          target=$(($(date +%s) + B_START_AFTER))
          while [ "$(date +%s)" -lt "$target" ]; do
            echo "A ACTIVE - B start in $((target - $(date +%s)))s"
            sleep 30
          done
      - name: Dispatch B
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run vps-test-standby.yml --repo "$REPO" --ref main -f source_run_id="$GITHUB_RUN_ID"
      - name: Find B
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            B_RUN=$(gh run list --workflow vps-test-standby.yml --repo "$REPO" --status in_progress --limit 20 --json databaseId --jq '.[] | select(.databaseId != '"$GITHUB_RUN_ID"') | .databaseId' | head -n1 || true)
            if [ -n "$B_RUN" ]; then
              echo "$B_RUN" >/tmp/b-run.txt
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Wait for B self verification
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          B_RUN=$(cat /tmp/b-run.txt)
          echo "NO B TIMEOUT: A stays active until B is verified."
          while true; do
            export B_RUN
            status=$(python3 - <<'PY'
          import os
          from pymongo import MongoClient
          d=MongoClient(os.environ["MONGO_URI"])["own_vps"].vps_runners.find_one({"_id":os.environ["B_RUN"]}) or {}
          print(d.get("status","unknown"))
          PY
            )
            echo "B_STATUS=$status"
            [ "$status" = "active" ] && break
            sleep 15
          done
      - name: Final safety gate
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          B_RUN=$(cat /tmp/b-run.txt)
          export B_RUN
          python3 - <<'PY'
          import os,sys
          from pymongo import MongoClient
          db=MongoClient(os.environ["MONGO_URI"])["own_vps"]
          b=os.environ["B_RUN"]
          r=db.vps_runners.find_one({"_id":b}) or {}
          live=db.vps_meta.find_one({"_id":"live"}) or {}
          print("B_STATUS=",r.get("status"))
          print("ACTIVE_RUNNER=",live.get("active_runner"))
          if r.get("status")!="active" or live.get("active_runner")!=b:
              sys.exit("SAFETY GATE FAILED")
          print("SAFETY_GATE=PASS")
      - name: End A only after B is verified
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          B_RUN=$(cat /tmp/b-run.txt)
          export B_RUN
          python3 - <<'PY'
          import os,time
          from pymongo import MongoClient
          db=MongoClient(os.environ["MONGO_URI"])["own_vps"]
          db.vps_meta.update_one({"_id":"test"},{"$set":{
            "status":"A_STOP_APPROVED","source_run":os.environ["GITHUB_RUN_ID"],
            "target_run":os.environ["B_RUN"],"time":time.time()
          }},upsert=True)
          print("B VERIFIED - A TEST WORKER MAY END")
          PY
          exit 0
