name: OWN VPS - Rolling 24/7 Worker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Deployment mode"
        required: true
        default: "initial"
        type: choice
        options: [initial, handover]
      source_run_id:
        description: "Previous worker run ID used for state restore"
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: read
  artifact-metadata: write

jobs:
  vps:
    name: VPS Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      VPS_ROOT: /opt/vps-data
      STATE_FILE: /tmp/vps-state.tar.gpg
      HANDOVER_AT: 10800
      REPO: ${{ github.repository }}
      SUPERDMZ_HOST: sareeffucker.dmzgate.com
      SUPERDMZ_PORT: 16740

    steps:
      - name: Prepare base system
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server curl jq git rsync gpg tar ca-certificates netcat-openbsd
          sudo mkdir -p "$VPS_ROOT"
          sudo chmod 755 "$VPS_ROOT"
          sudo systemctl enable --now ssh

      - name: Check SuperDMZ secret
        shell: bash
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPERDMZ_TOKEN" || {
            echo "Missing GitHub secret: SUPERDMZ_TOKEN"
            exit 1
          }

      - name: Install and connect SuperDMZ
        shell: bash
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
        run: |
          set -euo pipefail

          curl -fsSL https://superdmz.com/download/LinuxInstaller.sh | sudo sh

          sudo superdmz -add-token="$SUPERDMZ_TOKEN"

          echo "Waiting for SuperDMZ tunnel..."
          for i in $(seq 1 30); do
            if sudo superdmz -status 2>&1 | grep -qiE 'online|connected|active'; then
              break
            fi
            sleep 2
          done

          echo "SuperDMZ status:"
          sudo superdmz -status
          echo "SuperDMZ tunnels:"
          sudo superdmz -list

      - name: Configure hardened SSH
        shell: bash
        env:
          SSH_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEYS" || {
            echo "Missing GitHub secret: SSH_AUTHORIZED_KEYS"
            exit 1
          }

          sudo install -d -m 700 /root/.ssh
          printf '%s\n' "$SSH_KEYS" | sudo tee /root/.ssh/authorized_keys >/dev/null
          sudo chmod 600 /root/.ssh/authorized_keys

          sudo install -d -m 755 /etc/ssh/sshd_config.d
          sudo tee /etc/ssh/sshd_config.d/99-own-vps.conf >/dev/null <<'EOF'
          PermitRootLogin prohibit-password
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          ChallengeResponseAuthentication no
          X11Forwarding no
          AllowTcpForwarding yes
          ClientAliveInterval 60
          ClientAliveCountMax 3
          EOF

          sudo sshd -t
          sudo systemctl restart ssh

      - name: Download previous encrypted state
        if: ${{ inputs.mode == 'handover' && inputs.source_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: vps-state-${{ inputs.source_run_id }}
          path: /tmp/previous-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Restore application state
        if: ${{ inputs.mode == 'handover' && inputs.source_run_id != '' }}
        shell: bash
        env:
          STATE_KEY: ${{ secrets.VPS_STATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$STATE_KEY" || {
            echo "Missing GitHub secret: VPS_STATE_KEY"
            exit 1
          }

          test -f /tmp/previous-state/vps-state.tar.gpg
          printf '%s' "$STATE_KEY" >/tmp/state-pass
          chmod 600 /tmp/state-pass

          gpg --batch --yes --pinentry-mode loopback             --passphrase-file /tmp/state-pass             --decrypt /tmp/previous-state/vps-state.tar.gpg >/tmp/restore.tar

          sudo tar -xpf /tmp/restore.tar -C / --exclude='etc/ssh/ssh_host_*'

          rm -f /tmp/state-pass /tmp/restore.tar
          echo "Application state restored"

      - name: Restore PM2
        if: ${{ inputs.mode == 'handover' && inputs.source_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /root/.pm2/dump.pm2 ]; then
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo apt-get install -y nodejs npm
              sudo npm install -g pm2
            fi
            sudo pm2 resurrect || true
          fi

      - name: VPS readiness gate
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl is-active --quiet ssh
          test -d "$VPS_ROOT"

          for i in $(seq 1 20); do
            if timeout 5 bash -c "cat </dev/null >/dev/tcp/$SUPERDMZ_HOST/$SUPERDMZ_PORT" 2>/dev/null; then
              echo "SUPERDMZ TCP ENDPOINT REACHABLE: $SUPERDMZ_HOST:$SUPERDMZ_PORT"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "SuperDMZ public TCP endpoint did not become reachable"
              sudo superdmz -status || true
              exit 1
            fi
            sleep 2
          done

          printf 'ready run=%s time=%s host=%s port=%s\n'             "${{ github.run_id }}"             "$(date -u +%FT%TZ)"             "$SUPERDMZ_HOST"             "$SUPERDMZ_PORT" >/tmp/ready.txt

      - name: Publish worker READY signal
        if: ${{ inputs.mode == 'handover' && inputs.source_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: handover-ready-${{ inputs.source_run_id }}
          path: /tmp/ready.txt
          retention-days: 1
          compression-level: 0

      - name: Wait until rotation
        shell: bash
        run: |
          set -euo pipefail
          target=$(($(date +%s) + HANDOVER_AT))
          echo "Worker will hand over after $HANDOVER_AT seconds"
          while [ "$(date +%s)" -lt "$target" ]; do
            sleep 30
          done

      - name: Save encrypted persistent snapshot
        shell: bash
        env:
          STATE_KEY: ${{ secrets.VPS_STATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$STATE_KEY" || {
            echo "Missing GitHub secret: VPS_STATE_KEY"
            exit 1
          }

          command -v pm2 >/dev/null 2>&1 && sudo pm2 save || true

          sudo tar -cpf /tmp/vps-state.tar             /opt/vps-data             /root/.pm2             /root/.ssh/authorized_keys             /etc/ssh/ssh_host_*             2>/dev/null || true

          printf '%s' "$STATE_KEY" >/tmp/state-pass
          chmod 600 /tmp/state-pass

          gpg --batch --yes --pinentry-mode loopback             --passphrase-file /tmp/state-pass             --symmetric --cipher-algo AES256             --output "$STATE_FILE" /tmp/vps-state.tar

          rm -f /tmp/state-pass /tmp/vps-state.tar
          sudo chmod 600 "$STATE_FILE"

      - name: Upload encrypted state
        uses: actions/upload-artifact@v4
        with:
          name: vps-state-${{ github.run_id }}
          path: /tmp/vps-state.tar.gpg
          retention-days: 7
          compression-level: 0

      - name: Start next worker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run vps.yml             --repo "$REPO"             --ref main             -f mode=handover             -f source_run_id="${{ github.run_id }}"
          echo "NEXT WORKER DISPATCHED"

      - name: Wait for replacement READY
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            count=$(gh api               -H "Accept: application/vnd.github+json"               "/repos/$REPO/actions/artifacts?name=handover-ready-${{ github.run_id }}&per_page=1"               --jq '.artifacts | length' 2>/dev/null || echo 0)

            if [ "$count" -gt 0 ]; then
              echo "REPLACEMENT WORKER READY"
              exit 0
            fi

            sleep 10
          done

          echo "Replacement worker did not report READY"
          exit 1

      - name: Finish old worker
        shell: bash
        run: |
          set -euo pipefail
          sudo pm2 save 2>/dev/null || true
          echo "OLD WORKER DRAINING"
          sleep 30
