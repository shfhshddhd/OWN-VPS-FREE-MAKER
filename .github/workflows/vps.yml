name: OWN VPS - Rolling Mongo Live Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Deployment mode"
        required: true
        default: "initial"
        type: choice
        options: [initial, handover]
      source_run_id:
        description: "Previous active worker run ID"
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: read

jobs:
  vps:
    name: VPS Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      REPO: ${{ github.repository }}
      VPS_ROOT: /opt/vps-data
      SUPERDMZ_HOST: sareeffucker.dmzgate.com
      SUPERDMZ_PORT: 16740
      PREWARM_AT: 18000
      SYNC_INTERVAL: 15
      MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
      MONGO_DB: own_vps

    steps:
      - name: Prepare base system
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server curl jq git rsync ca-certificates netcat-openbsd python3-venv
          sudo mkdir -p "$VPS_ROOT"
          sudo chmod 755 "$VPS_ROOT"
          sudo systemctl enable --now ssh

      - name: Check required secrets
        shell: bash
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
          SSH_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
          STATE_KEY: ${{ secrets.VPS_STATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPERDMZ_TOKEN" || { echo "Missing SUPERDMZ_TOKEN"; exit 1; }
          test -n "$SSH_KEYS" || { echo "Missing SSH_AUTHORIZED_KEYS"; exit 1; }
          test -n "$STATE_KEY" || { echo "Missing VPS_STATE_KEY"; exit 1; }
          test -n "$MONGO_URI" || { echo "Missing MONGODB_URI (or MONGO_URI)"; exit 1; }

      - name: Install Mongo sync runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /opt/vps-sync-venv
          /opt/vps-sync-venv/bin/pip install --disable-pip-version-check --quiet "pymongo>=4.13,<5"

      - name: Install and connect SuperDMZ
        shell: bash
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://superdmz.com/download/LinuxInstaller.sh | sudo sh
          sudo superdmz -add-token="$SUPERDMZ_TOKEN"
          for i in $(seq 1 45); do
            if sudo superdmz -status 2>&1 | grep -qiE 'online|connected|active'; then
              break
            fi
            sleep 2
          done
          sudo superdmz -status
          sudo superdmz -list

      - name: Restore latest Mongo VPS state
        shell: bash
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          /opt/vps-sync-venv/bin/python vps/mongo_sync.py restore \
            --uri "$MONGO_URI" \
            --db "$MONGO_DB" \
            --runner-id "$GITHUB_RUN_ID"

      - name: Configure hardened SSH
        shell: bash
        env:
          SSH_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
        run: |
          set -euo pipefail
          sudo install -d -m 700 /root/.ssh
          printf '%s\n' "$SSH_KEYS" | sudo tee /root/.ssh/authorized_keys >/dev/null
          sudo chmod 600 /root/.ssh/authorized_keys
          sudo install -d -m 755 /etc/ssh/sshd_config.d
          sudo tee /etc/ssh/sshd_config.d/99-own-vps.conf >/dev/null <<'EOF'
          PermitRootLogin prohibit-password
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          ChallengeResponseAuthentication no
          X11Forwarding no
          AllowTcpForwarding yes
          ClientAliveInterval 60
          ClientAliveCountMax 3
          EOF
          sudo sshd -t
          sudo systemctl restart ssh

      - name: Start Mongo live sync
        shell: bash
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "handover" ]; then
            MODE=mirror
          else
            MODE=sync
          fi
          nohup /opt/vps-sync-venv/bin/python vps/mongo_sync.py "$MODE" \
            --uri "$MONGO_URI" \
            --db "$MONGO_DB" \
            --runner-id "$GITHUB_RUN_ID" \
            --generation "$GITHUB_RUN_NUMBER" \
            --interval "$SYNC_INTERVAL" \
            > /tmp/mongo-sync.log 2>&1 &
          echo $! >/tmp/mongo-sync.pid
          sleep 3
          cat /tmp/mongo-sync.log || true

      - name: VPS readiness gate
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl is-active --quiet ssh
          test -d "$VPS_ROOT"
          for i in $(seq 1 30); do
            if timeout 5 bash -c "cat </dev/null >/dev/tcp/$SUPERDMZ_HOST/$SUPERDMZ_PORT" 2>/dev/null; then
              echo "SUPERDMZ TCP ENDPOINT REACHABLE: $SUPERDMZ_HOST:$SUPERDMZ_PORT"
              break
            fi
            if [ "$i" -eq 30 ]; then
              sudo superdmz -status || true
              exit 1
            fi
            sleep 2
          done
          printf 'ready run=%s time=%s host=%s port=%s\n' \
            "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" "$SUPERDMZ_HOST" "$SUPERDMZ_PORT" >/tmp/ready.txt

      - name: Publish standby READY signal
        if: ${{ inputs.mode == 'handover' && inputs.source_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: standby-ready-${{ github.event.inputs.source_run_id }}-${{ github.run_id }}
          path: /tmp/ready.txt
          retention-days: 1
          compression-level: 0

      - name: Wait until prewarm handover
        shell: bash
        run: |
          set -euo pipefail
          target=$(($(date +%s) + PREWARM_AT))
          echo "Worker will prewarm replacement after $PREWARM_AT seconds"
          while [ "$(date +%s)" -lt "$target" ]; do
            sleep 30
          done

      - name: Start replacement worker
        if: ${{ inputs.mode == 'initial' || inputs.source_run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run vps.yml \
            --repo "$REPO" \
            --ref main \
            -f mode=handover \
            -f source_run_id="$GITHUB_RUN_ID"
          echo "REPLACEMENT DISPATCHED"

      - name: Wait for replacement READY
        if: ${{ inputs.mode == 'initial' || inputs.source_run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            count=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/artifacts?name=standby-ready-$GITHUB_RUN_ID-&per_page=100" \
              --jq '.artifacts | length' 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then
              echo "REPLACEMENT READY"
              exit 0
            fi
            sleep 10
          done
          echo "Replacement did not report READY"
          exit 1

      - name: Final Mongo sync from active worker
        if: ${{ inputs.mode == 'initial' || inputs.source_run_id != '' }}
        shell: bash
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          /opt/vps-sync-venv/bin/python vps/mongo_sync.py once \
            --uri "$MONGO_URI" \
            --db "$MONGO_DB" \
            --runner-id "$GITHUB_RUN_ID" \
            --generation "$GITHUB_RUN_NUMBER"

      - name: Request verified cutover
        if: ${{ inputs.mode == 'initial' || inputs.source_run_id != '' }}
        shell: bash
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_RUN=$(gh run list --workflow vps.yml --repo "$REPO" --status in_progress --limit 20 \
            --json databaseId --jq '.[] | select(.databaseId != '"$GITHUB_RUN_ID"') | .databaseId' | head -n1 || true)
          test -n "$TARGET_RUN" || { echo "Could not identify replacement run"; exit 1; }
          echo "TARGET_RUN=$TARGET_RUN"
          /opt/vps-sync-venv/bin/python vps/mongo_sync.py request-cutover \
            --uri "$MONGO_URI" \
            --db "$MONGO_DB" \
            --runner-id "$GITHUB_RUN_ID" \
            --generation "$GITHUB_RUN_NUMBER" \
            --target-run "$TARGET_RUN"
          echo "$TARGET_RUN" >/tmp/target-run.txt

      - name: Wait for replacement verification
        if: ${{ inputs.mode == 'initial' || inputs.source_run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_RUN=$(cat /tmp/target-run.txt)
          for i in $(seq 1 180); do
            count=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/artifacts?name=verified-$GITHUB_RUN_ID-$TARGET_RUN&per_page=1" \
              --jq '.artifacts | length' 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then
              echo "REPLACEMENT VERIFIED"
              exit 0
            fi
            sleep 10
          done
          echo "Replacement verification timeout"
          exit 1

      - name: Keep worker alive until replacement takes over
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for verified replacement"
          while true; do
            sleep 60
          done
